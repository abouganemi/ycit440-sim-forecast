name: Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Needed for pre-commit to work properly
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --all-groups --no-group gpu --locked

      - name: Run pre-commit hooks on the changed files
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.sha }}
        run: uv run prek run --show-diff-on-failure --from-ref="origin/$BASE_REF" --to-ref="$HEAD_SHA"

      - name: Type check
        run: uv run basedpyright

      - name: Test
        run: uv run pytest
