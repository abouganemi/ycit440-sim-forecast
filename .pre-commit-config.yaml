default_stages: [pre-commit]
repos:
  - repo: https://github.com/compilerla/conventional-pre-commit.git
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        # allowed Conventional Commits types ("!" for breaking changes is always accepted)
        args: [feat, fix, build, chore, ci, docs, perf, refactor, revert, style, test]
  - repo: builtin
    hooks:
      # docs/source/ holds official portal files saved byte-for-byte; never rewrite them.
      - id: end-of-file-fixer
        exclude: ^docs/source/
      - id: trailing-whitespace
        exclude: ^docs/source/
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        # The EDA notebook keeps its outputs (~1 MB of figures) so the team can read it without
        # running it; it opts in with "keep_output": true in its metadata, which nbstripout honours.
        exclude: ^notebooks/01_eda\.ipynb$
      - id: detect-private-key
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.19
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/kynan/nbstripout
    rev: 0.9.1
    hooks:
      - id: nbstripout
