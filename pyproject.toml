[project]
name = "ycit440-sim-forecast"
version = "1.2.0"
description = "ycit440-sim-forecast (data science project)"
readme = "README.md"
authors = [{ name = "Isaac Abouganem", email = "43149476+abouganemi@users.noreply.github.com" }]
requires-python = ">=3.13,<3.15"
dependencies = [
    "catboost>=1.2.10",
    "holidays>=0.105",
    "lightgbm>=4.7.0",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "polars>=1.44.2",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.9.1",
    "typer>=0.27.2",
    "xgboost-cpu>=3.4.1",
]

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "ipykernel>=7.3.0",
    "prek>=0.5.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
eda = [
    "matplotlib>=3.11.2",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
]
gpu = [
    "torch>=2.14.0",
    "triton-rocm>=3.8.0",
]

[tool.ruff]
# docs/ holds archival scripts copied from the framing stage; they are kept verbatim.
extend-exclude = ["docs"]
force-exclude = true # also skip them when pre-commit passes file names explicitly

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "S",
    "W",
    "EM",
    "ERA",
    "FURB",
    "LOG",
    "PT",
    "PTH",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # pytest uses assert
    "D",    # test names document themselves
]
"notebooks/**" = ["D", "E402", "ERA001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
typeCheckingMode = "standard"
# Setting exclude replaces the defaults, so the hidden-dir and cache patterns are repeated.
exclude = ["docs", "**/.*", "**/__pycache__", "**/node_modules"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--cov"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
default-groups = ["dev", "eda", "gpu"]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources.torch]
index = "pytorch-rocm"

[tool.uv.sources.triton-rocm]
index = "pytorch-rocm"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
