[project]
name = "python-template"
version = "1.0.0"
description = "template for python projects"
readme = "README.md"
authors = [{ name = "Isaac Abouganem", email = "43149476+abouganemi@users.noreply.github.com" }]
requires-python = ">=3.13,<3.15"

[dependency-groups]
dev = [
    "basedpyright>=1.40.1",
    "prek>=0.5.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff.lint]
select = [
    "A",
    "B",
    "C4",
    "D",
    "E",
    "F",
    "I",
    "N",
    "S",
    "W",
    "EM",
    "ERA",
    "FURB",
    "LOG",
    "PT",
    "PTH",
    "RUF",
    "SIM",
    "UP",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", # pytest uses assert
    "D",    # test names document themselves
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--cov"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
